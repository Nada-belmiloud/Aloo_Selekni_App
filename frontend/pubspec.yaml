name: emergency_app
description: Emergency call application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  image_picker: ^1.0.4
  shared_preferences: ^2.0.15
  flutter_bloc: ^8.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  equatable: ^2.0.5 
  uuid: ^4.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ambulance.png
    - assets/images/
    - assets/volunteer.jpg

  fonts:
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal-Regular.ttf
        - asset: fonts/Tajawal-Bold.ttf
          weight: 700
